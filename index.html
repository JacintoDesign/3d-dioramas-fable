<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3e7" />
    <title>Terra — An Atlas of Miniature Worlds</title>
    <meta name="description" content="Seven hand-built miniature 3D dioramas, generated entirely from code. Orbit, zoom and explore." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231f2421'/%3E%3Cpath d='M5 21l7-10 4 5 3-3 8 8z' fill='%23e9c98a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" data-theme="light">
      <div class="vignette"></div>
      <canvas id="stage" tabindex="0" aria-label="Interactive 3D diorama. Drag to orbit, scroll or pinch to zoom."></canvas>

      <header class="masthead">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1.2" />
          <ellipse cx="20" cy="25" rx="12" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.2" />
          <path d="M10 24.5l6-9 3.5 4.5 2.5-3 7 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
        </svg>
        <div>
          <h1>Terra</h1>
          <p>Atlas of miniature worlds</p>
        </div>
      </header>

      <nav class="collection" aria-label="Collection">
        <div class="rule-label"><span>The collection</span><span id="count"></span></div>
        <ol class="collection-list" id="list"></ol>
      </nav>

      <section class="placard" id="placard" aria-live="polite">
        <div class="placard-body">
          <p class="eyebrow"><span id="exhibit-no"></span><i></i><span>Scale 1 : 2,400</span></p>
          <h2 id="title"></h2>
          <p class="kicker" id="kicker"></p>
          <p class="blurb" id="blurb"></p>
          <dl class="facts" id="facts"></dl>
        </div>
      </section>

      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Viewer controls">
        <button class="tool" id="prev" aria-label="Previous exhibit" title="Previous exhibit (←)"></button>
        <span class="counter" id="counter" aria-hidden="true"></span>
        <button class="tool" id="next" aria-label="Next exhibit" title="Next exhibit (→)"></button>
        <span class="sep"></span>
        <button class="tool" id="rotate" aria-label="Auto-rotate" aria-pressed="true" title="Auto-rotate (Space)"></button>
        <button class="tool" id="reset" aria-label="Reset camera" title="Reset camera (R)"></button>
        <button class="tool" id="fullscreen" aria-label="Fullscreen" aria-pressed="false" title="Fullscreen (F)"></button>
      </div>

      <p class="hint" id="hint"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
